<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Exportar pele procedural</title>
<style>html,body{margin:0;background:#20181b}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildSkinBlock } from '/src/skin-model.js';

const root = buildSkinBlock();
const toB64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

window.exportGLB = async () => toB64(await new GLTFExporter().parseAsync(root, { binary: true, maxTextureSize: 1024 }));
window.exportUSDZ = async () => toB64(await new USDZExporter().parseAsync(root));

// prévia para conferência visual
const W = 900, H = 900;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.8; r.localClippingEnabled = true;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#20181b');
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;
const sun = new THREE.DirectionalLight('#fff', 1.6); sun.position.set(2, 4, 3); scene.add(sun);
scene.add(root);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
window.preview = (az, el, dist, cut) => {
  root.traverse(o => {
    if (o.userData.metade === 'anterior') o.visible = !cut;
  });
  const t = new THREE.Vector3(0, -0.85, 0);
  cam.position.set(t.x + dist * Math.cos(el) * Math.sin(az), t.y + dist * Math.sin(el), t.z + dist * Math.cos(el) * Math.cos(az));
  cam.lookAt(t); r.render(scene, cam); return r.domElement.toDataURL('image/jpeg', 0.85);
};
window.READY = true;
</script></body></html>
