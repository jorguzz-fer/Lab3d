server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # GLB não está na lista padrão de tipos do nginx
    types {
        model/gltf-binary glb;
        model/gltf+json   gltf;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json model/gltf-binary model/gltf+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # HTML sempre revalida (atualizações aparecem na hora)
    location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }

    # modelos e imagens: cache de 7 dias
    location ~* ^/(models|img)/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
